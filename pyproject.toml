[project]
name = "manimux"
version = "0.1.0"
description = "Local asynchronous policy runtime for dual-arm robot evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26,<2.5",
  "pillow>=10",
  "pydantic>=2.8",
  "pyzmq>=26",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "viser>=1.0.30",
  "yourdfpy>=0.0.58",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
molmoact-yam = [
  "fastapi>=0.116",
  "h5py>=3.11",
  "hf-transfer>=0.1.8",
  "huggingface-hub>=0.36",
  "json-numpy>=2.1.0",
  "omegaconf>=2.3",
  "opencv-python>=4.10",
  "pyrealsense2>=2.55",
  "requests>=2.32",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm>=4.66",
  "transformers>=4.57,<4.58",
  "tyro>=1.0.13",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
manimux = "manimux.cli:main"
manimux-viewer = "manimux.viewer.dashboard:main"
manimux-molmoact-yam = "manimux.viewer.integrations.molmoact_yam:main"
manimux-molmoact-camera = "manimux.integrations.molmoact_yam.camera_server:main"
manimux-molmoact-server = "manimux.integrations.molmoact_yam.host_server_yam:main"

[project.entry-points."manimux.viewer.robots"]
yam = "manimux.viewer.robots.yam:YamAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/manimux"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "manimux/THIRD_PARTY_NOTICES.md"
"licenses/MolmoAct2-APACHE-2.0.txt" = "manimux/licenses/MolmoAct2-APACHE-2.0.txt"
"licenses/i2rt-MIT.txt" = "manimux/licenses/i2rt-MIT.txt"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["manimux"]
exclude = ["src/manimux/integrations/molmoact_yam"]

[[tool.mypy.overrides]]
module = ["mujoco", "scipy", "scipy.*", "viser", "viser.*", "yourdfpy", "zarr", "zarr.*"]
ignore_missing_imports = true
