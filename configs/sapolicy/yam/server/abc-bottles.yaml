# XPolicyLab SAPolicy server for the dual-arm bottles checkpoint.
#
# Launch inside the SpatialAlignVLA Python environment after:
#   pip install -e XPolicyLab
#
#   python scripts/sapolicy_yam_server.py --config configs/sapolicy/yam/server/abc-bottles.yaml
#
# cfg_file MUST match the architecture used to train abc_tcp.ckpt. The checkpoint
# itself does not embed a full Hydra config — set this before first real load.
# Until then, dry_run: true exercises the WS contract with zero actions.

policy_name: SAPolicy
protocol: ws
host: 127.0.0.1
port: 8500

task_name: put_the_plastic_bottles_in_the_bin
env_cfg_type: yam_dual
action_type: ee
eval_batch: false

sapolicy_root: /home/jw/project/SpatialAlignVLA
# TODO: replace with the training yaml that built abc_tcp.ckpt
cfg_file: /home/jw/project/SpatialAlignVLA/configs/exps/PLACEHOLDER_MATCHING_abc_tcp.yaml
model_path: /home/jw/Desktop/project/manimux/abc_tcp.ckpt

output_format: packed_ee_wire
action_horizon: 16
body_frame_actions: true
use_ema: true
ckpt_type: ema
camera_names: [agentview]
device: cuda:0

# Set false after cfg_file points at a real matching config.
dry_run: true
