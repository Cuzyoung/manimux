# SAPolicy bottles via XPolicyLab WebSocket.
#
# Prerequisites:
#   1. SpatialAlign venv running:
#        python scripts/sapolicy_yam_server.py --config configs/sapolicy/yam/server/abc-bottles.yaml
#   2. camera server + viewer as in docs/sapolicy-yam-runbook.md
#
# Safety: connects paused when viewer.enabled; operator must Start at the robot.
run:
  task: put the plastic bottles in the bin
  output_dir: ./data
  max_steps: 1800

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    move_to_start_on_connect: false
    start_duration_s: 8.0
    home_duration_s: 5.0
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [front_camera]

policy:
  worker: xpolicylab_ws
  adapter: sapolicy_yam
  action_dt_s: 0.03333333333333333
  timeout_s: 20.0
  horizon_steps: 16
  inference_delay_s: 0.0
  startup_timeout_s: 180.0
  options:
    server: ws://127.0.0.1:8500
    connect_timeout_s: 5.0
    request_timeout_s: 20.0
    group_order: [left_arm, right_arm]
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    # XPolicy vision key = SAPolicy camera name; value = ManiMux sensor frame.
    camera_map:
      agentview: front_camera
    model_from_kinematics:
      left_arm:
        - [1.0, 0.0000036732, 0.0000036732, 0.2522021]
        - [-0.0000036732, 1.0, -0.0000053072, 0.3100003422]
        - [-0.0000036732, 0.0000053072, 1.0, 0.7504985942]
        - [0.0, 0.0, 0.0, 1.0]
      right_arm:
        - [1.0, 0.0000036732, 0.0000036732, 0.2522021]
        - [-0.0000036732, 1.0, -0.0000053072, -0.3099996578]
        - [-0.0000036732, 0.0000053072, 1.0, 0.7504985942]
        - [0.0, 0.0, 0.0, 1.0]
    camera_intrinsics:
      agentview:
        - [394.7972412109375, 0.0, 317.49383544921875]
        - [0.0, 394.2569885253906, 241.21372985839844]
        - [0.0, 0.0, 1.0]
    endpose_forward_offset_m: 0.12
    kinematics: yam
    kinematics_options:
      arm_type: yam
      gripper_type: linear_4310
      num_arm_joints: 6
      pos_threshold: 0.004
      ori_threshold: 0.002
      max_iters: 300

execution:
  runtime: manimux
  executor: direct
  inference_schedule: single_inflight
  refill_threshold_s: 0.25
  commit_lead_s: 0.0
  max_plan_age_s: 2.0
  blend_steps: 0

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: SAPolicy bottles · XPolicyLab WS

recording:
  enabled: true
  video_fps: 30.0
