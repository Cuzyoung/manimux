# SAPolicy bottles checkpoints consume 4:3 images. Keep this 640x480 setup
# isolated from the shared 640x360 camera configuration used by other policies.
sensors:
  cameras:
    left_camera:
      device_id: "260322276964"
      width: 640
      height: 480
      fps: 30
      max_frame_age_sec: 0.5
    front_camera:
      device_id: "260322276687"
      width: 640
      height: 480
      fps: 30
      max_frame_age_sec: 0.5
    right_camera:
      device_id: "260322274672"
      width: 640
      height: 480
      fps: 30
      max_frame_age_sec: 0.5
