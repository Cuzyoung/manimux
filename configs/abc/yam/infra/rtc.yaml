run:
  # ABC 的 prompt 走 CLIP 文本编码，措辞要贴近训练时的任务名。
  task: put the bottle into the box.
  output_dir: ./data
  # 一次 rollout 最多执行的控制步数；达到后自动回 Home 并退出。
  max_steps: 1600

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    move_to_start_on_connect: true
    # 初始化和回 Home 的运动时间（秒）：数值越小，运动越快。
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: abc_http
  adapter: abc_yam
  # ABC 的训练数据是 30 Hz，所以相邻两个 Policy 点间隔 1/30 秒。
  action_dt_s: 0.033333
  timeout_s: 1.0
  # ABC-DiT 的 chunk_length 固定为 30。
  horizon_steps: 30
  inference_delay_s: 0.0
  options:
    server: http://127.0.0.1:8300
    group_order: [left_arm, right_arm]
    camera_map:
      # 左边是 ABC 的相机名，右边是 camera server 里的相机名。
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
    # 流匹配采样步数；越小越快，参考实现用 10（低延迟时用 5）。
    # RTC 的 VJP 引导让推理慢约 1.4x；降到论文默认的 5 步压回延迟。
    diffusion_steps: 5

execution:
  # ---- RTC（实时分块，arXiv:2506.07339）----
  runtime: rtc
  rtc:
    # 开始下一次推理前至少执行多少步。实际执行步长 = max(min_execute_steps, d)。
    min_execute_steps: 15
    # 首次推理还没有实测延迟时的初值（控制步数）。
    initial_delay_steps: 8
    # 延迟预测取最近 10 次实测值的最大值（保守）。
    delay_buffer_size: 10
    # 引导权重上限。按 (t²+(1−t)²)/(t(1−t)) 在 t=1/steps 处取值：
    # 5 步采样 → 约 4.25。和下面的 diffusion_steps: 5 配套。
    beta: 4.25
  executor: smooth
  commit_lead_s: 0.0
  max_plan_age_s: 1.0
  blend_steps: 8
  smooth:
    cutoff_hz: 8.0
    # Policy 执行时的关节最高速度（rad/s）。
    max_velocity: 0.25
    # Policy 执行时的关节最大加速度（rad/s^2）。
    max_acceleration: 0.5
    position_limit_abs: 3.14
  mpc:
    horizon_steps: 15
    dynamics_a: 0.85
    tracking_weight: 10.0
    command_delta_weight: 1.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: ABC

recording:
  enabled: true
