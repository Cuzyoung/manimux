# XPolicyLab policy served over WebSocket, driving the dual YAM arms.
#
# Which policy this runs is decided when the XPolicyLab server is launched, not
# here -- this file only describes the robot, the wire, and the timing. Point
# `policy.options.server` at that server and keep everything else.
#
# ⚠️ THIS MOVES THE ARMS. Clear the workspace, keep the e-stop in hand, and
# confirm can_left / can_right are ERROR-ACTIVE before starting.

run:
  task: Pick the red ball up and place it into the box.
  output_dir: ./data
  # 一次 rollout 最多执行的控制步数；达到后自动回 Home 并退出。
  max_steps: 1600

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    move_to_start_on_connect: true
    # 初始化和回 Home 的运动时间（秒）：数值越小，运动越快。
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xpolicylab_ws
  adapter: xpolicylab
  # 30 Hz. This is what the runtime executes at AND what gets declared to the
  # policy as `additional_info.frequency` -- the rate is ours, not the model's.
  action_dt_s: 0.03333333333333333
  timeout_s: 1.0
  horizon_steps: 30
  inference_delay_s: 0.0
  options:
    server: ws://127.0.0.1:8500
    group_order: [left_arm, right_arm]
    # Our 7-value group is 6 arm joints + 1 gripper; XPolicyLab keeps the two
    # apart as `<prefix>_arm_joint_state` and `<prefix>_ee_joint_state`.
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    # keyed by XPolicyLab camera name, valued by our camera-server frame name
    camera_map:
      cam_head: front_camera
      cam_left_wrist: left_camera
      cam_right_wrist: right_camera

execution:
  # 普通 chunk 模式；要使用 RTC，模型 adapter 必须实现 get_action_rtc，并改用
  # execution.runtime: rtc（见 configs/pi05/yam/infra/base-rtc.yaml）。
  runtime: manimux
  executor: smooth
  inference_schedule: single_inflight
  refill_threshold_s: 0.5
  commit_lead_s: 0.0
  max_plan_age_s: 1.0
  underrun_hold_s: 0.5
  blend_steps: 8
  smooth:
    cutoff_hz: 8.0
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: XPolicyLab

recording:
  enabled: true
