run:
  task: Pick the red block up.
  output_dir: ./data
  max_steps: 1600

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    move_to_start_on_connect: true
    start_duration_s: 3.5
    home_duration_s: 3.5
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xpolicylab_ws
  adapter: xpolicylab
  # This checkpoint was trained at 30 Hz. ManiMux owns scheduling and execution,
  # but it must preserve the policy's native temporal meaning.
  action_dt_s: 0.03333333333333333
  timeout_s: 2.0
  horizon_steps: 16
  inference_delay_s: 0.0
  startup_timeout_s: 30.0
  options:
    server: ws://127.0.0.1:8500
    request_timeout_s: 10.0
    group_order: [left_arm, right_arm]
    group_prefixes:
      left_arm: left
      right_arm: right
    gripper_dofs: 1
    camera_map:
      cam_head: front_camera
      cam_left_wrist: left_camera
      cam_right_wrist: right_camera

execution:
  runtime: manimux
  executor: smooth
  inference_schedule: single_inflight
  refill_threshold_s: 0.2
  commit_lead_s: 0.0
  max_plan_age_s: 2.0
  blend_steps: 4
  smooth:
    cutoff_hz: 8.0
    # Keep the default ManiMux execution envelope identical to MolmoAct2.
    # Pi05 differs only where its native model contract requires it (30 Hz, H=16).
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: pi05 YAM finetune ManiMux 30Hz

recording:
  enabled: true
