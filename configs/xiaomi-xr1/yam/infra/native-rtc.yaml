run:
  task: put the bottle into the bin
  output_dir: ./data
  max_steps: 1600

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    move_to_start_on_connect: true
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: xr1_http
  adapter: xr1_yam
  action_dt_s: 0.033333
  timeout_s: 2.0
  horizon_steps: 30
  inference_delay_s: 0.0
  options:
    server: http://127.0.0.1:8400
    group_order: [left_arm, right_arm]
    camera_map:
      top_cam: front_camera
      left_cam: left_camera
      right_cam: right_camera
    kinematics: yam
    kinematics_options:
      arm_type: yam
      gripper_type: linear_4310
      num_arm_joints: 6

execution:
  runtime: rtc
  rtc:
    min_execute_steps: 15
    initial_delay_steps: 8
    delay_buffer_size: 10
    beta: 4.25
  executor: smooth
  inference_schedule: single_inflight
  refill_threshold_s: 0.4
  commit_lead_s: 0.0
  max_plan_age_s: 1.0
  underrun_hold_s: 0.5
  blend_steps: 8
  smooth:
    cutoff_hz: 8.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14
  mpc:
    horizon_steps: 15
    dynamics_a: 0.85
    tracking_weight: 10.0
    command_delta_weight: 1.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: Native Xiaomi XR-1 RTC

recording:
  enabled: true
