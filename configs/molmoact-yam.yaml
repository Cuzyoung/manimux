run:
  task: Pick the red ball up and place it into the box.
  output_dir: ./data
  max_steps: 600

robot:
  driver: yam_dual
  config: src/manimux/integrations/molmoact_yam/configs/molmoact_yam_left.yaml
  control_hz: 30.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: src/manimux/integrations/molmoact_yam/configs/molmoact_yam_right.yaml
    command_mode: shadow
    move_to_start_on_connect: false
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: false

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: molmoact_http
  adapter: molmoact_yam
  action_dt_s: 0.03333333333333333
  timeout_s: 1.0
  horizon_steps: 30
  inference_delay_s: 0.0
  options:
    server: http://127.0.0.1:8202
    group_order: [left_arm, right_arm]
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
    normalization_tag: yam_dual_molmoact2
    enable_cuda_graph: true

execution:
  executor: smooth
  inference_schedule: single_inflight
  refill_threshold_s: 0.5
  commit_lead_s: 0.0
  max_plan_age_s: 1.0
  underrun_hold_s: 0.5
  blend_steps: 8
  smooth:
    cutoff_hz: 8.0
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14
  mpc:
    horizon_steps: 15
    dynamics_a: 0.85
    tracking_weight: 10.0
    command_delta_weight: 1.0
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: MolmoAct

recording:
  enabled: true
