run:
  task: mock_dual_arm_wave
  output_dir: ./data
  max_steps: 120

robot:
  driver: mock_dual_arm
  control_hz: 100.0
  group_dims:
    left_arm: 6
    right_arm: 6
    left_gripper: 1
    right_gripper: 1

sensors:
  - name: overhead
    driver: mock_camera
    width: 64
    height: 48
    fps: 30.0

policy:
  worker: fake
  adapter: identity
  device: cpu
  action_dt_s: 0.05
  timeout_s: 0.5
  horizon_steps: 20
  inference_delay_s: 0.04

execution:
  executor: smooth
  refill_threshold_s: 0.4
  commit_lead_s: 0.02
  max_plan_age_s: 1.0
  underrun_hold_s: 0.5
  blend_steps: 2
  smooth:
    cutoff_hz: 8.0
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14
  mpc:
    horizon_steps: 15
    dynamics_a: 0.85
    tracking_weight: 10.0
    command_delta_weight: 1.0
    max_velocity: 2.0
    max_acceleration: 8.0
    position_limit_abs: 3.14

viewer:
  enabled: false
  robot_adapter: mock_dual_arm

recording:
  enabled: true
