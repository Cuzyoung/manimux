# Official foundation checkpoint with YAM projection stats. Run the base-bundle
# preparation script first. This is separate from the future YAM finetune config.
policy_name: LingBot_VLA2
protocol: ws
host: 127.0.0.1
port: 8501

bench_name: yam_real
task_name: pick_place
env_cfg_type: yam_dual
env_cfg: yam_dual
action_type: joint
eval_batch: false
checkpoint_variant: lingbot_vla2_6b_base_with_yam_stats

lingbot_vla2_root: lingbot_vla_v2
bundle_manifest_path: ../../../checkpoints/pretrained/lingbot-vla-v2-6b-yam-projection/bundle.yaml
checkpoint_source: robbyant/lingbot-vla-v2-6b
norm_stats_role: yam_projection_only_not_checkpoint_matched
use_bf16: true
use_fp32: false
use_compile: false
default_prompt: Pick the target object and place it in the container.
