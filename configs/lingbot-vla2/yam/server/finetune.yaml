# Formal XPolicy adapter for the official Robbyant LingBot-VLA2 source.
# This config intentionally fails its offline check until the complete bundle
# declared by bundle.yaml is supplied.
policy_name: LingBot_VLA2
protocol: ws
host: 127.0.0.1
port: 8501

bench_name: yam_real
task_name: pick_place
env_cfg_type: yam_dual
env_cfg: yam_dual
action_type: joint
eval_batch: false
checkpoint_variant: lingbot_vla2_yam_finetuned

lingbot_vla2_root: lingbot_vla_v2
bundle_manifest_path: checkpoints/yam_real-lingbot_vla2_yam-yam_dual-joint-0/bundle.yaml
use_bf16: true
use_fp32: false
use_compile: false
default_prompt: Perform the instructed bimanual manipulation task.
