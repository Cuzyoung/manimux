run:
  task: Pick the red ball up and place it into the box.
  output_dir: ./data
  # 一次 rollout 最多执行的控制步数；达到后自动回 Home 并退出。
  max_steps: 1600

robot:
  driver: yam_dual
  config: configs/robots/yam_left.yaml
  # RTC 每个控制周期执行一行 chunk，所以必须 = 1/policy.action_dt_s。
  control_hz: 20.0
  group_dims:
    left_arm: 7
    right_arm: 7
  options:
    right_config: configs/robots/yam_right.yaml
    command_mode: live
    move_to_start_on_connect: true
    # 初始化和回 Home 的运动时间（秒）：数值越小，运动越快。
    start_duration_s: 5.0
    home_duration_s: 5.0
    home_on_close: true

sensors:
  - name: yam_cameras
    driver: camera_server
    options:
      endpoint: tcp://127.0.0.1:5555
      request_timeout_ms: 500
      max_frame_age_sec: 0.5
      camera_names: [left_camera, front_camera, right_camera]

policy:
  worker: molmoact_http
  adapter: molmoact_yam
  # 老师原 ManiMux 的时间定义：相邻两个 Policy 点间隔 0.05 秒。
  action_dt_s: 0.05
  timeout_s: 1.0
  horizon_steps: 30
  inference_delay_s: 0.0
  options:
    server: http://127.0.0.1:8202
    group_order: [left_arm, right_arm]
    camera_map:
      left_cam: left_camera
      top_cam: front_camera
      right_cam: right_camera
    # RTC 的 VJP 引导让推理慢 2.2 倍（10 步采样时 613ms）。降到 5 步压回
    # 7 步延迟，可行窗口 d<=s<=H-d 才有余量。
    num_steps: 5
    normalization_tag: yam_dual_molmoact2
    enable_cuda_graph: true

execution:
  # ---- RTC（实时分块，arXiv:2506.07339）----
  runtime: rtc
  rtc:
    min_execute_steps: 15
    initial_delay_steps: 8
    delay_buffer_size: 10
    # 配 5 步采样：(t²+(1−t)²)/(t(1−t)) 在 t=1/5 处 ≈ 4.25
    beta: 4.25
    # 运动整形（低通/速度/加速度/位置限制）复用下面的 execution.smooth，
    # 和默认 runtime 完全同一套参数，只是折进 chunk 而不是放在下游。
  executor: smooth
  inference_schedule: single_inflight
  refill_threshold_s: 0.4
  commit_lead_s: 0.0
  max_plan_age_s: 1.0
  underrun_hold_s: 0.5
  blend_steps: 8
  smooth:
    cutoff_hz: 8.0
    # Policy 执行时的关节最高速度（rad/s）。
    max_velocity: 0.25
    # Policy 执行时的关节最大加速度（rad/s^2）。
    max_acceleration: 0.5
    position_limit_abs: 3.14
  mpc:
    horizon_steps: 15
    dynamics_a: 0.85
    tracking_weight: 10.0
    command_delta_weight: 1.0
    max_velocity: 0.25
    max_acceleration: 0.5
    position_limit_abs: 3.14

viewer:
  enabled: true
  robot_adapter: yam
  policy_label: MolmoAct

recording:
  enabled: true
