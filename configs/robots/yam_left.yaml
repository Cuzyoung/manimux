sensors:
  cameras:
    left_camera:
      device_id: "260322276964"
    front_camera:
      device_id: "260322276687"
    right_camera:
      device_id: "260322274672"

robot:
  _target_: manimux.robots.yam.arm.YAMRobot
  channel: can_left

agent:
  # 6 arm joints + gripper; taken from the first frame of a real red-ball episode.
  start_joints: [-0.6094071869993112, 0.5834668497749291, 0.8424887464713517, -1.0168230716411042, -0.11081864652475382, -0.45796139467459973, 0.9969282527609157]

hz: 30
max_steps: 600

storage:
  base_dir: "data/molmoact_yam_eval_runs"
  task_directory: "pick_the_red_ball_up_and_place_it_into_the_box"
  language_instruction: "Pick the red ball up and place it into the box."
  saver_max_workers: 2
  png_compress_level: 1

lerobot:
  fps: 30
  robot_type: "molmoact_dual_arm"
  hf_repo_id: "local/yam_eval_session"
  action_mode: "next_joint_fields"
  vcodec: "libsvtav1"
  image_writer_processes: 8
  image_writer_threads: 8
  parallel_encoding: true
  sanitize_online_viz_meta: true

eval:
  live_view_enabled: true
  mode: server
  molmoact_server: "127.0.0.1:8202"
  # Prefetch the next chunk while the final actions of the current window run.
  async_inference: true
  async_lead_steps: 7
  async_blend_steps: 8
  local:
    repo_id: "allenai/MolmoAct2-BimanualYAM"
    device: "cuda:0"
    dtype: "bfloat16"
    num_steps: 10
    enable_cuda_graph: false
    warmup: true
  camera_server:
    enabled: true
    endpoint: "tcp://127.0.0.1:5555"
    request_timeout_ms: 500
    max_frame_age_sec: 0.5
    pub_endpoint: "tcp://127.0.0.1:5556"
    recv_timeout_ms: 100
